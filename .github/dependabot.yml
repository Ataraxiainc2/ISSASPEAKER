# Dependabot keeps Gradle libraries and pinned GitHub Actions current (catalog F030).
# A Gradle update also needs gradle/verification-metadata.xml regenerated: see CLAUDE.md.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
