# Build, test and every quality gate on each push and pull request (catalog F029).
# Actions are pinned by commit SHA (F033); the comment after each pin is the release it came from.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Fails the job if gradle-wrapper.jar is not an official Gradle release.
          validate-wrappers: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Feature catalog is valid and docs/FEATURES.md is current
        run: python tools/features.py --check
      - name: Spelling (codespell)
        run: |
          python -m pip install --quiet codespell==2.4.1
          python -m codespell_lib
      - name: Build, unit tests, Android Lint, detekt
        run: ./gradlew --console=plain assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease detekt assembleDebugAndroidTest
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            build/reports/detekt/
          retention-days: 14
