# Manual check that this repository can reach Google Play (see play-access.yml and
# docs/design/PLAY-PUBLISHING.md). Works for any package of the developer account, for example an existing
# app, since ISSASPEAKER itself is not in Play Console yet.
name: Google Play

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to check
        required: true
        default: com.issasoda.issaspeaker

permissions:
  contents: read

jobs:
  play:
    uses: ./.github/workflows/play-access.yml
    with:
      package: ${{ inputs.package }}
    permissions:
      contents: read
      id-token: write
