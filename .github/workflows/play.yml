# Manual check that this repository can reach Google Play (see play-access.yml and
# docs/design/PLAY-PUBLISHING.md). Works for any package of the developer account.
# Called by its pinned commit, like every other repository: Google's trust rule accepts listed commits only.
name: Google Play

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to check
        required: true
        default: com.issasoda.issaspeaker

permissions:
  contents: read

jobs:
  play:
    uses: Ataraxiainc2/ISSASPEAKER/.github/workflows/play-access.yml@cd88e35fe086ad245ad51f9d2b0d6fe90f8d147e # pinned
    with:
      package: ${{ inputs.package }}
    permissions:
      contents: read
      id-token: write
